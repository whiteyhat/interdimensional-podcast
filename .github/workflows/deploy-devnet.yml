# The devnet rehearsal environment, deployed by hand and never by a push.
#
# Production auto-deploys from main. This one does not and must not: it prices every
# placement at a dollar and settles SOL against a number somebody typed, which is a
# rehearsal, not a shop. The worker itself refuses both of those settings unless its
# SOLANA_RPC_URL is on devnet, so the damage a mistake here can do is bounded.
#
# It also inverts the production guard. That job refuses to ship anything but the
# production database; this one refuses to ship the production database at all.

name: Deploy devnet

on:
  workflow_dispatch:

concurrency:
  group: deploy-devnet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        env:
          D1_DATABASE_NAME: ${{ vars.DEVNET_D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.DEVNET_D1_DATABASE_ID }}
          SPONSOR_ASSETS_BUCKET: ${{ vars.DEVNET_SPONSOR_ASSETS_BUCKET }}
        run: npm run build

      # Production's guard refuses anything that is not the production database.
      # Here the danger runs the other way: a devnet deploy that carries the production
      # database would point rehearsal traffic, and rehearsal prices, at real orders.
      - name: Verify the build does not point at production
        env:
          DEVNET: ${{ vars.DEVNET_D1_DATABASE_ID }}
          PRODUCTION: ${{ vars.D1_DATABASE_ID }}
        run: |
          ACTUAL=$(node -e "console.log(require('./dist/server/wrangler.json').d1_databases[0].database_id)")
          echo "built with database: $ACTUAL"
          if [ -z "$DEVNET" ]; then
            echo "::error::DEVNET_D1_DATABASE_ID repository variable is not set. Refusing to deploy a placeholder database."
            exit 1
          fi
          if [ "$ACTUAL" = "$PRODUCTION" ]; then
            echo "::error::This build carries the production database. Refusing to deploy it as devnet."
            exit 1
          fi
          if [ "$ACTUAL" != "$DEVNET" ]; then
            echo "::error::Built database id $ACTUAL does not match the expected devnet id."
            exit 1
          fi

      # The same danger for sponsor artwork. vite.config.ts falls back to the production bucket
      # when SPONSOR_ASSETS_BUCKET is empty, so a missing repository variable would quietly
      # store rehearsal logos and composited takes beside real customers' ones.
      - name: Verify the build keeps sponsor artwork out of the production bucket
        env:
          DEVNET_BUCKET: ${{ vars.DEVNET_SPONSOR_ASSETS_BUCKET }}
          PRODUCTION_BUCKET: pepe-chad-sponsor-assets
        run: |
          ACTUAL=$(node -e "const b=(require('./dist/server/wrangler.json').r2_buckets||[]).find(b=>b.binding==='SPONSOR_ASSETS');console.log(b?b.bucket_name:'')")
          echo "built with sponsor bucket: ${ACTUAL:-none}"
          if [ -z "$DEVNET_BUCKET" ]; then
            echo "::error::DEVNET_SPONSOR_ASSETS_BUCKET repository variable is not set. Refusing to deploy with the production fallback."
            exit 1
          fi
          if [ "$ACTUAL" = "$PRODUCTION_BUCKET" ]; then
            echo "::error::This build binds SPONSOR_ASSETS to the production bucket. Refusing to deploy it as devnet."
            exit 1
          fi
          if [ "$ACTUAL" != "$DEVNET_BUCKET" ]; then
            echo "::error::Built sponsor bucket '$ACTUAL' does not match DEVNET_SPONSOR_ASSETS_BUCKET."
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ vars.DEVNET_WORKER_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npx wrangler deploy --config dist/server/wrangler.json --name "${WORKER:-interdimensional-podcast-staging}"

      # A deploy that leaves checkout priced by whatever was set last time is worse than
      # no deploy: the operator would rehearse against a price nobody chose. Everything
      # the rehearsal depends on goes up with the code that reads it, including the
      # devnet RPC, without which the worker refuses the pricing it was just given.
      - name: Publish the devnet configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ vars.DEVNET_WORKER_NAME }}
          FLAT_CENTS: ${{ vars.DEVNET_FLAT_PRICE_CENTS }}
          SOL_USD: ${{ vars.DEVNET_SOL_USD }}
          RPC_URL: ${{ secrets.DEVNET_SOLANA_RPC_URL }}
          STREAM_EMBED_URL: ${{ vars.DEVNET_STREAM_EMBED_URL }}
          SPONSOR_MEDIA_URL: ${{ vars.DEVNET_SPONSOR_MEDIA_URL }}
          SPONSOR_MEDIA_TOKEN: ${{ secrets.DEVNET_SPONSOR_MEDIA_TOKEN }}
          SPONSOR_RECONCILE_TOKEN: ${{ secrets.DEVNET_SPONSOR_RECONCILE_TOKEN }}
          SITE_URL: ${{ vars.DEVNET_ORIGIN }}
        run: |
          NAME="${WORKER:-interdimensional-podcast-staging}"
          if [ -z "$RPC_URL" ]; then
            echo "::error::DEVNET_SOLANA_RPC_URL is not set. The worker refuses devnet pricing without a devnet RPC."
            exit 1
          fi
          case "$RPC_URL" in
            *devnet*|*localhost*|*127.0.0.1*) ;;
            *) echo "::error::DEVNET_SOLANA_RPC_URL is not a devnet endpoint."; exit 1 ;;
          esac
          put() { printf '%s' "$2" | npx wrangler secret put "$1" --config dist/server/wrangler.json --name "$NAME"; }
          put SOLANA_RPC_URL "$RPC_URL"
          put SPONSOR_FLAT_PRICE_CENTS "${FLAT_CENTS:-100}"
          put SPONSOR_SOL_USD "${SOL_USD:-150}"
          put SPONSOR_ENABLED "true"
          # Without a player the page says the stream does not exist yet, which on a
          # rehearsal site reads as broken rather than as nobody being on camera.
          if [ -n "$STREAM_EMBED_URL" ]; then
            put STREAM_EMBED_URL "$STREAM_EMBED_URL"
          else
            echo "::warning::DEVNET_STREAM_EMBED_URL is not set; the devnet site will say the stream link is coming soon."
          fi
          # The site's half of the two sponsorship services (node scripts/media.mjs setup devnet
          # prints the values). A missing one keeps the cap off sale or leaves payment recovery
          # to each buyer's own receipt: a rehearsal with a gap in it, not a broken deploy, so
          # it warns. A value that is present but unusable is a mistake to fix, so that fails.
          if [ -n "$SPONSOR_MEDIA_URL" ]; then
            case "$SPONSOR_MEDIA_URL" in
              https://*) put SPONSOR_MEDIA_URL "$SPONSOR_MEDIA_URL" ;;
              *) echo "::error::DEVNET_SPONSOR_MEDIA_URL must be an https address."; exit 1 ;;
            esac
          else
            echo "::warning::DEVNET_SPONSOR_MEDIA_URL is not set; the devnet cap stays off sale."
          fi
          if [ -n "$SPONSOR_MEDIA_TOKEN" ]; then
            if [ "${#SPONSOR_MEDIA_TOKEN}" -lt 24 ]; then
              echo "::error::DEVNET_SPONSOR_MEDIA_TOKEN is shorter than the 24 characters the worker requires."
              exit 1
            fi
            put SPONSOR_MEDIA_TOKEN "$SPONSOR_MEDIA_TOKEN"
          else
            echo "::warning::DEVNET_SPONSOR_MEDIA_TOKEN is not set; the devnet cap stays off sale."
          fi
          if [ -n "$SPONSOR_RECONCILE_TOKEN" ]; then
            if [ "${#SPONSOR_RECONCILE_TOKEN}" -lt 16 ]; then
              echo "::error::DEVNET_SPONSOR_RECONCILE_TOKEN is shorter than the 16 characters the worker requires."
              exit 1
            fi
            put SPONSOR_RECONCILE_TOKEN "$SPONSOR_RECONCILE_TOKEN"
          else
            echo "::warning::DEVNET_SPONSOR_RECONCILE_TOKEN is not set; the reconciler's calls will be refused."
          fi
          # Uploaded logos are addressed from SITE_URL, and the media service only fetches from
          # the origin it was given, so the two have to agree.
          if [ -n "$SITE_URL" ]; then
            put SITE_URL "$SITE_URL"
          else
            echo "::warning::DEVNET_ORIGIN is not set; the worker names uploaded logos by whichever address served the upload."
          fi

      - name: Check the devnet site prices a placement at a dollar
        env:
          ORIGIN: ${{ vars.DEVNET_ORIGIN }}
        run: |
          SITE="${ORIGIN:-https://interdimensional-podcast-staging.leonardo-chekup.workers.dev}"
          for i in 1 2 3 4 5; do
            CENTS=$(curl -s "$SITE/api/sponsorship?action=catalog" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).products.map(p=>p.priceCents).join(','))}catch{console.log('')}})" || true)
            echo "attempt $i: placement prices $CENTS"
            [ "$CENTS" = "100,100,100" ] && echo "devnet pricing is live" && exit 0
            sleep 10
          done
          echo "::error::The devnet catalog did not report a dollar per placement."
          exit 1
