# Auto-deploy to Cloudflare Workers on every push to main.
#
# The build bakes the D1 database id into dist/server/wrangler.json (vite.config.ts reads it
# from the environment), and .env.production, which holds it locally, is gitignored. So CI must
# supply it as a repository variable. Without it the build emits a placeholder database id and
# the deployed site would answer paid requests from an empty database nothing else writes to --
# a silent failure, so the deploy refuses to ship a build that does not match.
#
# The public site URL is not a build input: app/layout.tsx reads process.env.SITE_URL at
# runtime, which nodejs_compat fills from the worker's own vars, so it lives as a worker secret.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        env:
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: npm run build

      # The staging database id has shipped to production before by way of a stale dist/.
      # A build that produced anything other than the production id must not reach the edge.
      # Checked against the id itself, not only the variable the build was given: a variable
      # holding the staging id would otherwise build staging and pass its own comparison.
      - name: Verify the build points at the production database
        env:
          EXPECTED: ${{ vars.D1_DATABASE_ID }}
          PRODUCTION_D1: b4a21bd4-5ba5-43f3-9f77-46c7745727f0
        run: |
          ACTUAL=$(node -e "console.log(require('./dist/server/wrangler.json').d1_databases[0].database_id)")
          echo "built with database: $ACTUAL"
          if [ -z "$EXPECTED" ]; then
            echo "::error::D1_DATABASE_ID repository variable is not set. Refusing to deploy a placeholder database."
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ] || [ "$ACTUAL" != "$PRODUCTION_D1" ]; then
            echo "::error::Built database id $ACTUAL is not the production database $PRODUCTION_D1."
            exit 1
          fi

      # The devnet deploy refuses this bucket; production must have it. A stale staging build,
      # or a SPONSOR_ASSETS_BUCKET leaking into this job, would file paid customers' artwork
      # and composited takes in the rehearsal bucket, where the production site never looks.
      - name: Verify the build stores sponsor artwork in the production bucket
        env:
          EXPECTED: pepe-chad-sponsor-assets
        run: |
          ACTUAL=$(node -e "const b=(require('./dist/server/wrangler.json').r2_buckets||[]).find(b=>b.binding==='SPONSOR_ASSETS');console.log(b?b.bucket_name:'')")
          echo "built with sponsor bucket: ${ACTUAL:-none}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Built sponsor bucket '$ACTUAL' is not the production bucket $EXPECTED."
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions. The token needs Workers Scripts:Edit, Workers R2 Storage:Edit, D1:Edit and Workers KV:Edit."
            exit 1
          fi
          npx wrangler deploy --config dist/server/wrangler.json

      # The site's half of the two sponsorship services (node scripts/media.mjs setup production
      # prints the values). Only the addresses and the shared tokens: this step never touches
      # SPONSOR_ENABLED, which is Carlos's decision alone, and never a price. A missing value
      # leaves the cap off sale, which is the state production is in anyway, so it warns; a
      # value that is present but unusable is a mistake to fix, so it fails.
      - name: Publish the sponsorship service settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPONSOR_MEDIA_URL: ${{ vars.SPONSOR_MEDIA_URL }}
          SPONSOR_MEDIA_TOKEN: ${{ secrets.SPONSOR_MEDIA_TOKEN }}
          SPONSOR_RECONCILE_TOKEN: ${{ secrets.SPONSOR_RECONCILE_TOKEN }}
        run: |
          put() { printf '%s' "$2" | npx wrangler secret put "$1" --config dist/server/wrangler.json; }
          if [ -n "$SPONSOR_MEDIA_URL" ]; then
            case "$SPONSOR_MEDIA_URL" in
              https://*) ;;
              *) echo "::error::SPONSOR_MEDIA_URL must be an https address."; exit 1 ;;
            esac
            # A rehearsal desk prices nothing, but it tailors against the rehearsal site and
            # holds the rehearsal token: production must never be pointed at one.
            case "$SPONSOR_MEDIA_URL" in
              *devnet*|*staging*) echo "::error::SPONSOR_MEDIA_URL names a rehearsal desk."; exit 1 ;;
            esac
            put SPONSOR_MEDIA_URL "$SPONSOR_MEDIA_URL"
          else
            echo "::warning::SPONSOR_MEDIA_URL is not set; the cap stays off sale."
          fi
          if [ -n "$SPONSOR_MEDIA_TOKEN" ]; then
            if [ "${#SPONSOR_MEDIA_TOKEN}" -lt 24 ]; then
              echo "::error::SPONSOR_MEDIA_TOKEN is shorter than the 24 characters the worker requires."
              exit 1
            fi
            put SPONSOR_MEDIA_TOKEN "$SPONSOR_MEDIA_TOKEN"
          else
            echo "::warning::SPONSOR_MEDIA_TOKEN is not set; the cap stays off sale."
          fi
          if [ -n "$SPONSOR_RECONCILE_TOKEN" ]; then
            if [ "${#SPONSOR_RECONCILE_TOKEN}" -lt 16 ]; then
              echo "::error::SPONSOR_RECONCILE_TOKEN is shorter than the 16 characters the worker requires."
              exit 1
            fi
            put SPONSOR_RECONCILE_TOKEN "$SPONSOR_RECONCILE_TOKEN"
          else
            echo "::warning::SPONSOR_RECONCILE_TOKEN is not set; payment recovery is left to each buyer's receipt."
          fi

      - name: Check the site answers
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' https://frogclench.fun/ || true)
            [ "$CODE" = "200" ] && echo "frogclench.fun OK" && exit 0
            echo "attempt $i: HTTP $CODE"; sleep 10
          done
          echo "::error::frogclench.fun did not return 200 after the deploy."
          exit 1
